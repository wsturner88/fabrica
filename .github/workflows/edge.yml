name: Edge image

# After CI passes on main, publish the Hub as ghcr.io/<owner>/<repo>:edge (amd64 + arm64) so anyone
# can try the newest main. Never writes `latest` or a version tag - those belong to release.yml.
# `edge` moves with every green commit: do not run it in production.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  edge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}      # exactly the commit CI tested

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag and OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge
          labels: |
            org.opencontainers.image.title=Fabrica Hub (edge)
            org.opencontainers.image.description=Unreleased build of main - for testing only
            org.opencontainers.image.licenses=MIT

      - name: Build and push edge (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_REV=edge-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,scope=edge,mode=max,ignore-error=true
